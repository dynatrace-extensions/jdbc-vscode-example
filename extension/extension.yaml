#                      Minimal Example Extension - JDBC
# ==================================================================================================
# Dynatrace documentation for the data source: https://docs.dynatrace.com/docs/shortlink/sql-reference
# For general extension yaml documentation: https://docs.dynatrace.com/docs/shortlink/extension-yaml
#
# This is a minimal example of how to ingest data. It is not meant to be comprehensive, but rather
# provide a useful starting point to creating custom extensions.
#
# NOTE: For best results, work with these examples using the VS Code Dynatrace Extensions Add-On.
# https://marketplace.visualstudio.com/items?itemName=DynatracePlatformExtensions.dynatrace-extensions
# ==================================================================================================

name: custom:jdbc-vscode-example
version: 0.0.1
minDynatraceVersion: 1.318.0
author:
  name: "Your Name Here"
  
# Define metadata for the metrics that will be ingested
metrics:
  # Its a good practice to name metric keys with a prefix that relates to the extension's name/function
  - key: jdbc_example.product_quantity
    # While not required, metadata is useful for viewing metric descriptions in the UI, and allows for intelligent formatting of units in DQL Tables or dashboard charts for example.
    metadata:
      displayName: Product quantity
      description: The quantity of products in the products table.
      # Available units can be browsed with the 'auto-complete' functionality of VS Code using the Dynatrace Extensions Add-On.
      # This example uses the `Unspecified` unit. But if this metric was gathering disk space  data, the unit could be set to `MegaByte`.
      unit: Unspecified
      
# This node defines the data source that will be used for gathering data. Note that The `JDBC`
# configuration slightly varies different than the `sql*` configurations, since information for the
# JDBC driver has to be specified. See https://docs.dynatrace.com/docs/shortlink/jdbc-monitoring for
# more details.
jdbc:
  driverClassName: org.mariadb.jdbc.Driver
  validationQuery: SELECT 1
  versionQuery: SELECT 1
  connectionStringPattern: ^jdbc:mariadb://.*$
  connectionStringPatternErrorMessage: "The connection string must be a valid JDBC
    MySQL connection string starting with 'jdbc:mariadb://', check:
    https://mariadb.com/kb/en/about-mariadb-connector-j"
  errorMessage: An error occurred while trying to connect to the database. Please
    check the connection details and try again.
    
  groups:
  - group: product queries
    ingest: metrics
    query: SELECT product_code, count(*) as quantity FROM products
    metrics:
      - key: jdbc_example.product_quantity
        value: col:quantity
        type: gauge  
    dimensions:
      - key: product_code
        value: col:product_code
        
  - group: log ingest example
    interval:
      minutes: 5
    # The SQL data source can ingest logs from query results as well as metrics. The `content` key ALWAYS mut be included. Additional attributes can be defined as shown below.
    ingest: log
    query: SELECT order_description, product_id FROM orders
    attributes:
      - key: content
        value: col:order_description
      - key: productID
        value: col:product_id
      - key: table
        # The `const` keyword indicates that this value is not dependent on a column fetched from the query, its some piece of hard-coded data defined within the extension.yaml  
        value: const:orders
          
